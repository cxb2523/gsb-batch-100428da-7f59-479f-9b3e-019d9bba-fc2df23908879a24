<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄小说 CDP 下载器</title>
<style>
  :root {
    --bg: #14100c;
    --surface: #1e1813;
    --surface-2: #271f18;
    --line: #3a2e23;
    --text: #f4ece1;
    --muted: #a99b89;
    --tomato: #ff5a36;
    --tomato-dim: #c9421f;
    --ok: #6bbf59;
    --warn: #e0b341;
    --err: #e5604a;
    --radius: 14px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); line-height: 1.5;
    background-image: radial-gradient(circle at 15% -10%,
      rgba(255,90,54,.14), transparent 45%);
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  h1 { font-size: 27px; margin: 0; letter-spacing: -.5px; font-weight: 700; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(145deg, var(--tomato), var(--tomato-dim));
    display: grid; place-items: center; font-size: 19px;
    box-shadow: 0 6px 18px rgba(255,90,54,.35); align-self: center;
  }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 32px 48px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 24px; margin-bottom: 22px;
  }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 0 0 18px; font-weight: 600;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 11px 13px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    font-size: 15px; font-family: var(--mono); transition: border-color .15s;
  }
  input:focus { outline: none; border-color: var(--tomato); }
  input:disabled { opacity: .45; }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }
  .opts { display: flex; gap: 22px; align-items: center; margin: 18px 0 4px;
    flex-wrap: wrap; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 14px; color: var(--text); }
  .check input { width: 16px; height: 16px; accent-color: var(--tomato); }
  .actions { display: flex; gap: 12px; margin-top: 22px; }
  button {
    font-family: var(--sans); font-size: 15px; font-weight: 600;
    padding: 12px 22px; border-radius: 10px; border: 1px solid transparent;
    cursor: pointer; transition: transform .08s, background .15s, opacity .15s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-go { background: var(--tomato); color: #fff; }
  .btn-go:hover:not(:disabled) { background: #ff6c4b; }
  .btn-stop { background: transparent; color: var(--err); border-color: var(--err); }
  .btn-stop:hover:not(:disabled) { background: rgba(229,96,74,.12); }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--line); }
  .hint b { color: var(--warn); font-weight: 600; }

  /* progress */
  .status-head { display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 14px; }
  .badge { font-size: 12px; padding: 4px 11px; border-radius: 20px;
    font-weight: 600; letter-spacing: .3px; }
  .badge.idle { background: var(--surface-2); color: var(--muted); }
  .badge.running { background: rgba(255,90,54,.16); color: var(--tomato); }
  .badge.done { background: rgba(107,191,89,.16); color: var(--ok); }
  .badge.stopped, .badge.error { background: rgba(229,96,74,.16); color: var(--err); }
  .book-title { font-size: 17px; font-weight: 600; }
  .bar { height: 9px; background: var(--bg); border-radius: 6px;
    overflow: hidden; margin: 6px 0 8px; }
  .bar > i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--tomato-dim), var(--tomato));
    border-radius: 6px; transition: width .3s ease; }
  .counts { display: flex; justify-content: space-between; font-size: 13px;
    color: var(--muted); font-family: var(--mono); }
  .counts b { color: var(--text); }
  .log {
    margin-top: 16px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; padding: 12px 14px; height: 190px; overflow-y: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
    color: var(--muted); white-space: pre-wrap;
  }
  .log .ok { color: var(--ok); }
  .log .bad { color: var(--err); }

  /* books */
  .book { display: flex; align-items: center; justify-content: space-between;
    padding: 13px 0; border-bottom: 1px solid var(--line); }
  .book:last-child { border-bottom: none; }
  .book .meta { display: flex; flex-direction: column; gap: 2px; }
  .book .name { font-size: 15px; }
  .book .size { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .book a { text-decoration: none; }
  .btn-dl { background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); font-size: 13px; padding: 8px 16px; }
  .btn-dl:hover { border-color: var(--tomato); color: var(--tomato); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--line);
    color: var(--text); padding: 12px 20px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">🍅</span>
    <h1>番茄小说 CDP 下载器</h1>
  </header>
  <p class="sub">通过接管你已登录的 Chrome 抓取正文并解密 · 端口 9333</p>

  <div class="card">
    <h2>新建下载</h2>
    <div id="form">
      <label for="novel">小说 ID 或 /page/ 链接</label>
      <input type="text" id="novel" placeholder="例如 7143038691944959011 或 https://fanqienovel.com/page/7143038691944959011">

      <div class="opts">
        <label class="check">
          <input type="checkbox" id="attach"> 接管当前已打开的阅读页（从该章往后抓）
        </label>
      </div>

      <div class="row" style="margin-top:8px">
        <div>
          <label for="start">起始章（可选）</label>
          <input type="number" id="start" min="1" placeholder="默认 1">
        </div>
        <div>
          <label for="end">结束章（可选）</label>
          <input type="number" id="end" min="1" placeholder="默认最后一章">
        </div>
      </div>

      <div class="opts">
        <label class="check"><input type="checkbox" id="split" checked> 额外导出分章 TXT</label>
      </div>

      <div class="actions">
        <button class="btn-go" id="goBtn">开始下载</button>
        <button class="btn-stop" id="stopBtn" disabled>停止</button>
      </div>
      <p class="hint">先用 <b>launch_chrome.bat</b> 启动专用 Chrome 并登录番茄，别关那个窗口。撞验证码时脚本会自动暂停，你在窗口里手动过码即可继续。</p>
    </div>
  </div>

  <div class="card">
    <div class="status-head">
      <span class="book-title" id="stTitle">尚未开始</span>
      <span class="badge idle" id="stBadge">空闲</span>
    </div>
    <div class="bar"><i id="stBar"></i></div>
    <div class="counts">
      <span>已抓 <b id="stFetched">0</b> / 待抓 <b id="stTodo">0</b></span>
      <span id="stLast"></span>
    </div>
    <div class="log" id="stLog"></div>
  </div>

  <div class="card">
    <h2>已下载</h2>
    <div id="books"><div class="empty">加载中…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let polling = null;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

async function jpost(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined});
  return {status: r.status, data: await r.json()};
}

async function start() {
  const body = {
    novel: $('novel').value.trim() || null,
    attach: $('attach').checked,
    start: $('start').value ? parseInt($('start').value) : null,
    end: $('end').value ? parseInt($('end').value) : null,
    split: $('split').checked,
  };
  const {status, data} = await jpost('/api/start', body);
  toast(data.message);
  if (data.ok) { setRunning(true); poll(); }
}

async function stop() {
  const {data} = await jpost('/api/stop');
  toast(data.message);
}

function setRunning(on) {
  $('goBtn').disabled = on;
  $('stopBtn').disabled = !on;
  ['novel','attach','start','end','split'].forEach(k => $(k).disabled = on);
}

const BADGE = {idle:'空闲', catalog:'读取目录', running:'下载中',
  done:'完成', stopped:'已停止', error:'出错'};

function render(s) {
  const badge = $('stBadge');
  badge.className = 'badge ' + (s.phase === 'catalog' ? 'running' : s.phase);
  badge.textContent = BADGE[s.phase] || s.phase;
  $('stTitle').textContent = s.title ? `《${s.title}》` : '尚未开始';
  $('stFetched').textContent = s.fetched || 0;
  $('stTodo').textContent = s.todo || 0;
  $('stLast').textContent = s.last || '';
  const pct = s.todo ? Math.round((s.fetched / s.todo) * 100) : (s.phase==='done'?100:0);
  $('stBar').style.width = pct + '%';
  const log = $('stLog');
  log.innerHTML = (s.log || []).map(l => {
    const cls = l.startsWith('✓') ? 'ok' : (l.startsWith('✗')||l.startsWith('错误')||l.startsWith('异常') ? 'bad' : '');
    return cls ? `<span class="${cls}">${escapeHtml(l)}</span>` : escapeHtml(l);
  }).join('\n');
  log.scrollTop = log.scrollHeight;
}

function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function poll() {
  if (polling) clearInterval(polling);
  const tick = async () => {
    const r = await fetch('/api/status');
    const s = await r.json();
    render(s);
    if (!s.running) {
      setRunning(false);
      clearInterval(polling); polling = null;
      loadBooks();
    }
  };
  await tick();
  polling = setInterval(tick, 1200);
}

async function loadBooks() {
  const r = await fetch('/api/books');
  const {books} = await r.json();
  const el = $('books');
  if (!books.length) { el.innerHTML = '<div class="empty">还没有下载任何小说。</div>'; return; }
  el.innerHTML = books.map(b => `
    <div class="book">
      <div class="meta">
        <span class="name">${escapeHtml(b.dir)}</span>
        <span class="size">${escapeHtml(b.txt)} · ${b.size_mb} MB</span>
      </div>
      <a href="/api/download/${encodeURIComponent(b.dir)}"><button class="btn-dl">下载 TXT</button></a>
    </div>`).join('');
}

$('goBtn').onclick = start;
$('stopBtn').onclick = stop;
// 初始加载：若已有任务在跑则接上轮询
(async () => {
  const s = await (await fetch('/api/status')).json();
  render(s);
  if (s.running) { setRunning(true); poll(); }
  loadBooks();
})();
</script>
</body>
</html>
