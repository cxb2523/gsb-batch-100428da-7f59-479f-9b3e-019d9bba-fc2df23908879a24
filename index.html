  var n = typeof value === 'number' ? value : parseFloat(value);
  if (!isFinite(n) || n <= 0) return DEFAULT_SCRIPT_TIMEOUT_MS;
  if (n < MIN_SCRIPT_TIMEOUT_MS) return MIN_SCRIPT_TIMEOUT_MS;
  if (n > MAX_SCRIPT_TIMEOUT_MS) return MAX_SCRIPT_TIMEOUT_MS;
  return Math.round(n);
}

function readConfig(options){
  var config = { scriptTimeoutMs: DEFAULT_SCRIPT_TIMEOUT_MS };
  var globalConfig = window[CONFIG_KEY];
  if (globalConfig && typeof globalConfig === 'object' && globalConfig.scriptTimeoutMs != null) {
    config.scriptTimeoutMs = globalConfig.scriptTimeoutMs;
  }
  if (options && typeof options === 'object' && options.scriptTimeoutMs != null) {
    config.scriptTimeoutMs = options.scriptTimeoutMs;
  }
  config.scriptTimeoutMs = normalizeTimeout(config.scriptTimeoutMs);
  return config;
}

/* ------------------------------------------------------------------ */
/* Decode: join the payload templates and XOR-decode the hidden page    */
/* ------------------------------------------------------------------ */
function collectTemplates(){
  var all = document.getElementsByTagName('template');
  var found = [];
  for (var i = 0; i < all.length; i++) {
    var id = all[i].id || '';
    if (TEMPLATE_ID_RE.test(id)) found.push(all[i]);
  }
  return found;
}

function decodePayload(){
  var templates = collectTemplates();
  if (!templates.length) {
    throw makeError('TEMPLATES_MISSING', 'no payload <template> elements were found');
  }

  var joined = '';
  for (var i = 0; i < templates.length; i++) {
    joined += templates[i].innerHTML || '';
  }
  if (!joined.replace(/\s+/g, '')) {
    throw makeError('PAYLOAD_EMPTY', 'payload <template> elements are empty');
  }

  var key;
  try {
    key = atob(KEY_B64);
  } catch (e) {
    throw makeError('KEY_DECODE_FAILED', 'decode key is invalid: ' + toMessage(e));
  }
  if (!key.length) {
    throw makeError('KEY_DECODE_FAILED', 'decode key decoded to an empty string');
  }

  var raw;
  try {
    raw = atob(joined);
  } catch (e) {
    throw makeError('PAYLOAD_BASE64_INVALID', 'payload is not valid base64: ' + toMessage(e));
  }

  var bytes = new Uint8Array(raw.length);
  for (var j = 0; j < raw.length; j++) {
    bytes[j] = raw.charCodeAt(j) ^ key.charCodeAt(j % key.length);
  }

  var html;
  try {
    html = new TextDecoder('utf-8').decode(bytes);
  } catch (e) {
    try {
      var chunked = '';
      for (var k = 0; k < bytes.length; k += 8192) {
        chunked += String.fromCharCode.apply(null, bytes.subarray(k, k + 8192));
      }
      html = decodeURIComponent(escape(chunked));
    } catch (e2) {
      throw makeError('PAYLOAD_UTF8_INVALID', 'decoded payload is not valid UTF-8: ' + toMessage(e));
    }
  }
  if (!html.length) {
    throw makeError('PAYLOAD_EMPTY', 'decoded payload is empty');
  }

  return {
    html: html,
    templates: templates.length,
    encodedLength: joined.length,
    decodedLength: html.length
  };
}

/* ------------------------------------------------------------------ */
/* Parse the decoded document and lift every <script> out of it        */
/* ------------------------------------------------------------------ */
var JS_MIME_TYPES = {
  'text/javascript': true,
  'application/javascript': true,
  'application/x-javascript': true,
  'text/ecmascript': true,
  'application/ecmascript': true,
  'application/x-ecmascript': true,
  'text/jscript': true,
  'text/livescript': true
};

var MODULES_SUPPORTED = (function(){
  try { return 'noModule' in document.createElement('script'); }
  catch (e) { return false; }
})();

function resolveUrl(url){
  try {
    return new URL(url, document.baseURI).href;
  } catch (e) {
    try {
      var anchor = document.createElement('a');
      anchor.href = url;
      return anchor.href;
    } catch (e2) {
      return url;
    }
  }
}

function parseAttributes(raw){
  var attrs = {};
  var order = [];
  var re = /([^\s"'=<>\/]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;
  var match;
  while ((match = re.exec(raw)) !== null) {
    var name = match[1].toLowerCase();
    var value = match[2] !== undefined ? match[2]
              : match[3] !== undefined ? match[3]
              : match[4] !== undefined ? match[4] : '';
    if (!hasOwn(attrs, name)) {
      attrs[name] = value;
      order.push(name);
    }
  }
  return { attrs: attrs, order: order };
}

function isExecutableScript(attrs){
  if (MODULES_SUPPORTED && attrs.nomodule !== undefined) return false;
  var type = (attrs.type || '').replace(/^\s+|\s+$/g, '').toLowerCase();
  if (!type) return true;
  type = type.split(';')[0].replace(/^\s+|\s+$/g, '');
  if (type === 'module') return true;
  return JS_MIME_TYPES[type] === true;
}

function createScript(attrsRaw, code, index, kind){
  var parsed = parseAttributes(attrsRaw);
  var attrs = parsed.attrs;
  var src = attrs.src ? String(attrs.src).replace(/^\s+|\s+$/g, '') : '';
  var external = kind === 'external' || !!src;
  var type = (attrs.type || '').split(';')[0].replace(/^\s+|\s+$/g, '').toLowerCase();
  return {
    index: index,
    kind: external ? 'external' : 'inline',
    rawSrc: src,
    code: code,
    attrs: attrs,
    attrOrder: parsed.order,
    id: attrs.id || '',
    isModule: type === 'module',
    executable: isExecutableScript(attrs),
    label: external ? src : ('inline:script#' + index)
  };
}

function parseDocument(html){
  var titleMatch = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(html);
  var title = titleMatch ? titleMatch[1] : '';

  var headMatch = /<head[^>]*>([\s\S]*?)<\/head>/i.exec(html);
  var bodyMatch = /<body[^>]*>([\s\S]*?)<\/body>/i.exec(html);
  var head = headMatch ? headMatch[1] : '';
  var body = bodyMatch ? bodyMatch[1] : html;

  var scripts = [];
  var scriptRe = /<script\b((?:"[^"]*"|'[^']*'|[^>"'])*)>([\s\S]*?)<\/script\s*>/gi;

  function lift(fragment){
    return fragment.replace(scriptRe, function(match, attrsRaw, code){
      scripts.push(createScript(attrsRaw, code, scripts.length));
      return '';
    });
  }

  // Head scripts are lifted first so the list stays in document order.
  head = lift(head);
  body = lift(body);
  head = head.replace(/<title[^>]*>[\s\S]*?<\/title>/i, '');

  return { title: title, head: head, body: body, scripts: scripts };
}

/* ------------------------------------------------------------------ */
/* Inject the decoded document into the live page (exactly once)       */
/* ------------------------------------------------------------------ */
function injectDocument(parsed){
  if (injected) {
    throw makeError('ALREADY_INJECTED', 'page content was already injected');
  }
  injected = true;

  if (parsed.title) {
    try { document.title = parsed.title; } catch (e) { /* ignore */ }
  }

  if (parsed.head) {
    var holder = document.createElement('div');
    holder.innerHTML = parsed.head;
    var allowed = { STYLE: true, META: true, LINK: true, BASE: true };
    while (holder.firstChild) {
      var node = holder.firstChild;
      var tag = (node.tagName || '').toUpperCase();
      if (allowed[tag] === true) {
        document.head.appendChild(node);
      } else {
        holder.removeChild(node);
      }
    }
  }

  var target = document.body || document.documentElement;
  target.innerHTML = parsed.body;
}

/**
 * Resolve external sources only after injection, so a <base href> that came
 * from the decoded document is honoured exactly as the browser would have
 * applied it to the original page.
 */
function resolveScriptSources(scripts){
  for (var i = 0; i < scripts.length; i++) {
    var script = scripts[i];
    if (script.kind !== 'external') {
      script.src = '';
      continue;
    }
    script.src = resolveUrl(script.rawSrc);
    script.label = script.src;
  }
}

/* ------------------------------------------------------------------ */
/* Script runner: original order, failures isolated, external timeouts */
/* ------------------------------------------------------------------ */
function applyAttributes(element, script){
  for (var i = 0; i < script.attrOrder.length; i++) {
    var name = script.attrOrder[i];
    if (name === 'src' || name === 'async') continue;
    try { element.setAttribute(name, script.attrs[name]); }
    catch (e) { /* ignore invalid attribute names */ }
  }
}

function appendScript(element){
  var target = document.body || document.documentElement;
  target.appendChild(element);
}

function describeUncaught(ev){
  var message = '';
  if (ev && typeof ev.message === 'string') message = ev.message;
  if (ev && ev.error) {
    var err = ev.error;
    if (err.name && err.message) message = err.name + ': ' + err.message;
    else if (err.message) message = err.message;
    else if (err.name) message = err.name;
  }
  if (!message) message = 'uncaught error';
  var location = '';
  if (ev && ev.filename) {
    location = ev.filename;
    if (ev.lineno) location += ':' + ev.lineno;
    if (ev.colno) location += ':' + ev.colno;
  }
  return location ? message + ' (' + location + ')' : message;
}

function summarize(records){
  var summary = {
    total: records.length,
    executed: 0,
    inert: 0,
    succeeded: 0,
    failed: 0,
    timedOut: 0
  };
  for (var i = 0; i < records.length; i++) {
    var record = records[i];
    if (record.executable) summary.executed++;
    else summary.inert++;
    if (record.status === 'success') summary.succeeded++;
    else if (record.status === 'timeout') summary.timedOut++;
    else summary.failed++;
  }
  return summary;
}

function runScripts(scripts, timeoutMs){
  return new Promise(function(resolve){
    var records = [];
    for (var i = 0; i < scripts.length; i++) {
      var script = scripts[i];
      records.push({
        index: script.index,
        type: script.kind,
        source: script.kind === 'external' ? script.src : script.label,
        id: script.id || null,
        status: 'pending',
        reason: '',
        executable: script.executable
      });
    }

    if (!scripts.length) {
      resolve(records);
      return;
    }

    var cursor = 0;
    var current = -1;
    var slotActive = false;
    var listenerAttached = false;

    function onWindowError(ev){
      // Only uncaught script exceptions carry a message; resource load
      // failures are plain Events (handled by the element's onerror).
      if (!ev || typeof ev.message !== 'string') return;
      if (ev.target && ev.target !== window) return;
      if (!slotActive || current < 0) return;
      if (!records[current].reason) records[current].reason = describeUncaught(ev);
      // Module failures never reach their completion sentinel; stop waiting.
      if (typeof records[current].abortModule === 'function') records[current].abortModule();
    }

    if (!listenerAttached) {
      window.addEventListener('error', onWindowError, true);
      listenerAttached = true;
    }

    function detachListener(){
      if (!listenerAttached) return;
      listenerAttached = false;
      window.removeEventListener('error', onWindowError, true);
    }

    function settle(record, status, reason){
      record.status = status;
      record.reason = status === 'success' ? '' : (reason || 'script failed for an unknown reason');
    }

    function advance(){
      slotActive = false;
      current = -1;
      next();
    }

    function next(){
      if (cursor >= scripts.length) {
        detachListener();
        resolve(records);
        return;
      }

      var script = scripts[cursor];
      var record = records[cursor];
      cursor++;
      current = script.index;
      slotActive = true;

      // Inert data blocks (JSON-LD, import maps, nomodule in modern browsers)
      // are re-inserted untouched and never executed.
      if (!script.executable) {
        var inert = document.createElement('script');
        applyAttributes(inert, script);
        if (script.kind === 'external') inert.src = script.src;
        else inert.textContent = script.code;
        appendScript(inert);
        settle(record, 'success', '');
        advance();
        return;
      }

      if (script.kind === 'inline') {
        var inline = document.createElement('script');
        applyAttributes(inline, script);

        // Inline module scripts evaluate asynchronously and never fire
        // load/error on the element, so completion is observed through a
        // sentinel statement appended to the module body. Static imports
        // still have to resolve before that statement runs, which preserves
        // the ordering guarantee; a throw or a failed import never reaches
        // it and is reported through the window error listener.
        if (script.isModule) {
          var sentinel = '__landing_bootstrap_done_' + (sentinelSeq++);
          var moduleSettled = false;
          var moduleTimer = null;
          var modulePoll = null;

          function finishModule(status, reason){
            if (moduleSettled) return;
            moduleSettled = true;
            if (modulePoll) clearInterval(modulePoll);
            if (moduleTimer) clearTimeout(moduleTimer);
            delete record.abortModule;
            try { delete globalThis[sentinel]; } catch (e) { globalThis[sentinel] = undefined; }
            settle(record, status, reason);
            advance();
          }

          function moduleLanded(){
            try { return globalThis[sentinel] === true; } catch (e) { return false; }
          }

          record.abortModule = function(){
            if (moduleSettled || moduleLanded()) return;
            finishModule('failure', record.reason || 'module script threw before completing');
          };

          moduleTimer = setTimeout(function(){
            finishModule('timeout', 'timed out after ' + timeoutMs + ' ms');
          }, timeoutMs);

          inline.textContent = script.code + '\n;globalThis["' + sentinel + '"]=true;\n';
          appendScript(inline);

          modulePoll = setInterval(function(){
            if (moduleSettled || !moduleLanded()) return;
            var reason = record.reason;
            finishModule(reason ? 'failure' : 'success', reason);
          }, 10);
          return;
        }

        inline.textContent = script.code;
        appendScript(inline);

        // Uncaught errors are reported in a queued task; yield one
        // macrotask so they can be attributed to this script.
        setTimeout(function(){
          var reason = record.reason;
          settle(record, reason ? 'failure' : 'success', reason);
          advance();
        }, 0);
        return;
      }

      // External script: load with a hard timeout.
      var external = document.createElement('script');
      applyAttributes(external, script);
      // NOTE: deliberately not setting async=false. That would put the
      // element into the browser's ordered-script queue, where a single
      // hung predecessor silently blocks every later external script.
      // Ordering here is enforced by this runner appending one script at
      // a time and waiting for it to settle.
      external.src = script.src;

      var settled = false;
      var timer = setTimeout(function(){
        if (settled) return;
        settled = true;
        external.onload = null;
        external.onerror = null;
        try { external.removeAttribute('src'); } catch (e) { /* ignore */ }
        if (external.parentNode) external.parentNode.removeChild(external);
        settle(record, 'timeout', 'timed out after ' + timeoutMs + ' ms');
        advance();
      }, timeoutMs);

      external.onload = function(){
        if (settled) return;
        // Let uncaught-error events raised while evaluating the file flush.
        setTimeout(function(){
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          var reason = record.reason;
          settle(record, reason ? 'failure' : 'success', reason);
          advance();
        }, 0);
      };

      external.onerror = function(){
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        settle(record, 'failure', 'failed to load script ' + script.src);
        advance();
      };

      appendScript(external);
    }

    next();
  });
}

/* ------------------------------------------------------------------ */
/* Outcome assembly                                                    */
/* ------------------------------------------------------------------ */
function errorInfo(stage, err){
  return {
    stage: stage,
    code: (err && err.code) ? String(err.code) : null,
    name: err && err.name ? String(err.name) : null,
    message: toMessage(err)
  };
}

function publishFailure(startedAt, stage, err){
  var outcome = {
    ok: false,
    complete: true,
    pageReady: false,
    status: 'failed',
    version: VERSION,
    startedAt: startedAt,
    finishedAt: now(),
    durationMs: now() - startedAt,
    page: null,
    decode: null,
    error: errorInfo(stage, err),
    scripts: [],
    summary: { total: 0, executed: 0, inert: 0, succeeded: 0, failed: 0, timedOut: 0 }
  };
  publish(outcome);
  return outcome;
}

function publish(outcome){
  outcomeRef = outcome;
  state = 'complete';
  try { window[OUTCOME_KEY] = outcome; } catch (e) { /* ignore */ }
  setHtmlState(outcome.status);

  try {
    var event;
    if (typeof CustomEvent === 'function') {
      event = new CustomEvent('landing-bootstrap:complete', { detail: outcome });
    } else {
      event = document.createEvent('CustomEvent');
      event.initCustomEvent('landing-bootstrap:complete', false, false, outcome);
    }
    document.dispatchEvent(event);
  } catch (e) { /* non-fatal */ }
}

function execute(config){
  var startedAt = now();

  var payload;
  try {
    payload = decodePayload();
  } catch (e) {
    return Promise.resolve(publishFailure(startedAt, 'decode', e));
  }

  var parsed;
  try {
    parsed = parseDocument(payload.html);
  } catch (e) {
    return Promise.resolve(publishFailure(startedAt, 'parse', e));
  }

  try {
    injectDocument(parsed);
  } catch (e) {
    return Promise.resolve(publishFailure(startedAt, 'inject', e));
  }

  resolveScriptSources(parsed.scripts);

  var pageInfo = {
    title: parsed.title || '',
    templates: payload.templates,
    decodedLength: payload.decodedLength,
    scripts: parsed.scripts.length
  };
  var decodeInfo = {
    ok: true,
    templates: payload.templates,
    encodedLength: payload.encodedLength,
    decodedLength: payload.decodedLength
  };

  return runScripts(parsed.scripts, config.scriptTimeoutMs).then(function(records){
    var summary = summarize(records);
    var status = (summary.failed === 0 && summary.timedOut === 0) ? 'success' : 'partial';
    var finishedAt = now();
    var outcome = {
      ok: status === 'success',
      complete: true,
      pageReady: true,
      status: status,
      version: VERSION,
      startedAt: startedAt,
      finishedAt: finishedAt,
      durationMs: finishedAt - startedAt,
      page: pageInfo,
      decode: decodeInfo,
      error: null,
      scripts: records,
      summary: summary
    };
    publish(outcome);
    return outcome;
  });
}

/* ------------------------------------------------------------------ */
/* Public API                                                          */
/* ------------------------------------------------------------------ */
function run(options){
  if (promise) return promise;

  var config = readConfig(options);
  state = 'running';
  setHtmlState('running');
  try { window[OUTCOME_KEY] = null; } catch (e) { /* ignore */ }

  promise = new Promise(function(resolve){
    whenDomReady(function(){
      var execution;
      try {
        execution = execute(config);
      } catch (e) {
        execution = Promise.resolve(publishFailure(now(), 'run', e));
      }
      execution.then(resolve, function(e){
        resolve(publishFailure(now(), 'run', e));
      });
    });
  });

  return promise;
}

function scheduleAutoRun(){
  if (autoScheduled || promise) return;
  autoScheduled = true;
  whenDomReady(function(){ run(); });
}

var api = {
  __installed: true,
  version: VERSION,
  run: run,
  scheduleAutoRun: scheduleAutoRun,
  getOutcome: function(){ return outcomeRef; },
  getState: function(){ return state; },
  defaultScriptTimeoutMs: DEFAULT_SCRIPT_TIMEOUT_MS
};

try { window[OUTCOME_KEY] = null; } catch (e) { /* ignore */ }
window[GLOBAL_KEY] = api;
window[LEGACY_ALIAS] = api;
setHtmlState('idle');

if (document.readyState === 'loading') {
  scheduleAutoRun();
} else {
  scheduleAutoRun();
}
})();</script></body></html>
