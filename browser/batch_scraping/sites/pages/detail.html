<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Detail Page</title>
</head>
<body>
  <h1 id="detail-title">Detail Page</h1>
  <p id="detail-lead">
    Reached after a successful button click. The runner must keep text
    collected here even if a later step fails.
  </p>

  <section class="records">
    <article class="record">
      <h2>Record Alpha</h2>
      <p class="record-body">Alpha body content worth scraping.</p>
    </article>
    <article class="record">
      <h2>Record Beta</h2>
      <p class="record-body">Beta body content worth scraping.</p>
    </article>
    <article class="record">
      <h2>Record Gamma</h2>
      <p class="record-body">Gamma body content worth scraping.</p>
    </article>
  </section>

  <button type="button" id="back-btn" data-action="navigate-detail">Reload detail</button>
</body>
</html>
