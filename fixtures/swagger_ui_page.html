<!DOCTYPE html>
<html>
<head><title>Swagger UI - Pet Store</title></head>
<body>
<div id="swagger-ui"></div>
<script>
const spec = {
  "openapi": "3.0.0",
  "info": {"title": "Pet Store API", "version": "2.0.0"},
  "paths": {
    "/pets": {"get": {"summary": "List pets", "responses": {"200": {"description": "OK"}}}}
  }
};
SwaggerUIBundle({spec: spec, dom_id: '#swagger-ui'});
</script>
</body>
</html>
