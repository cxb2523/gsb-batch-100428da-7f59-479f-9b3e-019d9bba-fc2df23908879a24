<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stale Element Repro</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    button, a.btn { display: inline-block; margin: 8px; padding: 12px 20px; font-size: 16px; }
    #overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(255, 255, 255, 0.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #555;
    }
  </style>
</head>
<body>
  <nav><a href="#">Home</a></nav>
  <h1>Demo App</h1>
  <p>This app re-renders as soon as its content is read, removing its primary buttons.</p>

  <!-- These three rank highest (primary buttons) but vanish before the click lands. -->
  <button data-vanish>Get Started</button>
  <button data-vanish>Sign Up</button>
  <button data-vanish>Continue</button>

  <!-- This link survives the re-render and is the fallback target. -->
  <a class="btn" href="about.html">About</a>

  <!-- Blocks pointer events until the "re-render" so no click can land early. -->
  <div id="overlay">Loading…</div>

  <script>
    // Simulate an app that re-renders right after its content is inspected:
    // the first read of a primary button's text (which DOM-based element
    // discovery does) schedules the removal of those buttons. The overlay
    // guarantees no click can succeed before the removal lands.
    (function () {
      const innerText = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'innerText');
      let armed = true;
      function rerender() {
        document.querySelectorAll('[data-vanish]').forEach(function (el) { el.remove(); });
        const overlay = document.getElementById('overlay');
        if (overlay) overlay.remove();
      }
      document.querySelectorAll('[data-vanish]').forEach(function (el) {
        Object.defineProperty(el, 'innerText', {
          configurable: true,
          get: function () {
            if (armed) {
              armed = false;
              setTimeout(rerender, 20);
            }
            return innerText.get.call(this);
          }
        });
      });
    })();
  </script>
</body>
</html>
