<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>推荐牛人翻页场景演示页（离线）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #f0f3f7; color: #222; min-width: 900px; }
    .navbar { background: #fff; border-bottom: 1px solid #e3e8ee; padding: 10px 24px; display: flex; gap: 16px; align-items: center; }
    .navbar .brand { font-size: 17px; font-weight: 700; color: #00c26e; }
    .navbar .mode { font-size: 12px; color: #b45309; background: #fff7e6; border: 1px solid #f0c36d; padding: 3px 10px; border-radius: 12px; }
    .main { padding: 14px 24px; }
    .list-table { background: #fff; border: 1px solid #e3e8ee; border-radius: 8px; overflow: hidden; }
    .list-head, .list-row { display: grid; grid-template-columns: 90px 200px 150px 90px; align-items: center; gap: 8px; padding: 9px 12px; font-size: 12px; }
    .list-head { background: #f7faf9; color: #888; font-weight: 600; border-bottom: 1px solid #e3e8ee; }
    .list-row { border-bottom: 1px solid #f0f3f7; }
    .list-row:last-child { border-bottom: 0; }
    .list-row .name { font-weight: 700; }
    .list-row .position { color: #00a35c; font-weight: 600; }
    .list-row .company { color: #888; }
    .list-row .greet { background: #00c26e; color: #fff; border: 0; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .empty-hint { padding: 30px; text-align: center; color: #999; font-size: 13px; }
    .pagination { text-align: center; margin: 14px 0; position: relative; }
    .pagination button { background: #fff; border: 1px solid #e3e8ee; padding: 5px 16px; border-radius: 5px; cursor: pointer; font-size: 13px; }
    .pagination button[disabled] { color: #bbb; cursor: not-allowed; }
    .pagination .page-info { margin: 0 12px; color: #666; font-size: 12px; }
    /* broken 模式：透明遮罩盖住翻页按钮，Playwright 点击会被拦截并超时抛异常 */
    .blocker { position: absolute; inset: 0; z-index: 10; display: none; }
    .blocker.show { display: block; }
    .dialog { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.18); width: 400px; padding: 18px; z-index: 100; display: none; }
    .dialog.show { display: block; }
    .dialog h4 { font-size: 14px; margin-bottom: 10px; }
    .dialog textarea { width: 100%; height: 80px; border: 1px solid #e3e8ee; border-radius: 6px; padding: 8px; font-size: 13px; resize: none; }
    .dialog .ops { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .dialog .ops button { padding: 5px 14px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    .dialog .send { background: #00c26e; color: #fff; border: 0; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; z-index: 200; display: none; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand">BOSS 直聘</div>
    <div>推荐牛人</div>
    <div class="mode" id="modeBadge">翻页场景：normal</div>
  </nav>
  <div class="main">
    <div class="list-table" id="listTable"></div>
    <div class="pagination">
      <span class="page-info" id="pageInfo">第 1 页</span>
      <button id="nextBtn" class="pagination-next">下一页</button>
      <div class="blocker" id="blocker"></div>
    </div>
  </div>

  <div class="dialog" id="greetDialog">
    <h4 id="dialogTitle">发送招呼语</h4>
    <textarea class="message" id="greetText">您好，方便沟通吗？</textarea>
    <div class="ops">
      <button class="cancel" id="cancelBtn">取消</button>
      <button class="send" id="sendBtn">发送</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // 场景由 ?mode= 指定：
    //   normal —— 正常翻页，最后一页「下一页」按钮禁用
    //   stuck  —— 点击「下一页」无任何反应（列表保持同一批人）
    //   empty  —— 翻到第二页后列表为空
    //   broken —— 「下一页」按钮被透明遮罩盖住，点击会超时失败
    const mode = new URLSearchParams(location.search).get("mode") || "normal";
    document.getElementById("modeBadge").textContent = "翻页场景：" + mode;
    if (mode === "broken") document.getElementById("blocker").classList.add("show");

    const PAGES = [
      [
        { name: "张一", position: "Java 后端工程师", company: "甲公司", salary: "30-45K" },
        { name: "李二", position: "Java 开发工程师", company: "乙公司", salary: "25-40K" },
        { name: "王三", position: "后端工程师", company: "丙公司", salary: "28-42K" }
      ],
      [
        { name: "刘四", position: "Java 高级工程师", company: "丁公司", salary: "30-50K" },
        { name: "陈五", position: "Java 工程师", company: "戊公司", salary: "22-35K" },
        { name: "杨六", position: "Java 专家", company: "己公司", salary: "40-60K" }
      ],
      [
        { name: "赵七", position: "Java 后端", company: "庚公司", salary: "18-30K" },
        { name: "黄八", position: "Java 开发工程师", company: "辛公司", salary: "20-35K" }
      ]
    ];

    let curPage = 1;
    const MAX_PAGE = PAGES.length;

    function render() {
      const table = document.getElementById("listTable");
      const items = mode === "empty" && curPage > 1 ? [] : (PAGES[curPage - 1] || []);
      if (!items.length) {
        table.innerHTML = '<div class="empty-hint">暂无更多推荐牛人</div>';
      } else {
        table.innerHTML =
          '<div class="list-head"><span>姓名</span><span>职位</span><span>公司</span><span>操作</span></div>' +
          items.map(c => `
            <div class="list-row">
              <span class="name">${c.name}</span>
              <span class="position">${c.position}</span>
              <span class="company">${c.company}</span>
              <button class="greet" data-name="${c.name}">打招呼</button>
            </div>`).join("");
      }
      document.getElementById("pageInfo").textContent = `第 ${curPage} 页`;
      const btn = document.getElementById("nextBtn");
      const atEnd = mode === "empty" ? curPage > 1 : curPage >= MAX_PAGE;
      btn.disabled = atEnd;
      if (atEnd) btn.setAttribute("disabled", "disabled");
      else btn.removeAttribute("disabled");
      bindGreet();
    }

    function bindGreet() {
      document.querySelectorAll(".greet").forEach(btn => {
        btn.addEventListener("click", () => {
          document.getElementById("dialogTitle").textContent = "发送招呼语 - " + btn.dataset.name;
          document.getElementById("greetDialog").classList.add("show");
        });
      });
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (mode === "stuck") return;                 // 点击无反应：列表仍为同一批人
      if (mode === "empty" && curPage >= 1) {       // 翻页后列表为空
        curPage += 1;
        render();
        return;
      }
      if (curPage < MAX_PAGE) {
        curPage += 1;
        render();
      }
    });

    document.getElementById("sendBtn").addEventListener("click", () => {
      document.getElementById("greetDialog").classList.remove("show");
      showToast("招呼语已发送");
    });
    document.getElementById("cancelBtn").addEventListener("click", () => {
      document.getElementById("greetDialog").classList.remove("show");
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = "none"; }, 2000);
    }

    render();
  </script>
</body>
</html>
