name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go tests (unit only, no Redis)
        working-directory: crawler
        run: go test ./internal/frontier/ ./internal/robots/ ./internal/fetcher/ -v

  python-intelligence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: intelligence
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm
      - name: Run pipeline tests
        working-directory: intelligence
        run: pytest tests/test_entity_pipeline.py tests/test_schema_pipeline.py tests/test_worker.py -v

  python-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run API tests
        working-directory: api
        run: pytest tests/ -v

  python-mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: mcp_server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run MCP tests
        working-directory: mcp_server
        run: pytest tests/ -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: [go-tests, python-intelligence-tests, python-api-tests, python-mcp-tests]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: phantombot
          POSTGRES_USER: phantombot
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run DB migrations
        env:
          PGPASSWORD: testpassword
        run: psql -h localhost -U phantombot -d phantombot -f store/migrations/001_initial.sql
      - name: Run Go integration tests
        working-directory: crawler
        env:
          REDIS_URL: redis://localhost:6379
        run: go test ./... -v
      - name: Install Python deps
        working-directory: intelligence
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm
      - name: Run Intelligence integration tests
        working-directory: intelligence
        env:
          REDIS_URL: redis://localhost:6379
          POSTGRES_PASSWORD: testpassword
          QDRANT_PORT: "6333"
        run: pytest tests/ -v
