name: "Code Quality & Syntax Check"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-lint:
    name: "Python Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: "Lint Python Source Code"
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 python-cli/ --count --select=E9,F63,F7,F82 --show-source --statistics

  extension-tests:
    name: "Chrome Extension Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome-extension
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Syntax check extension scripts"
        run: |
          node --check content.js
          node --check popup.js
          node --check background.js

      - name: "Run chunking / checkpoint / resume tests"
        run: node --test tests/*.test.js
