name: build-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file EXE
        run: pyinstaller --onefile --name YuketangAutoPlayer --collect-all selenium --noconfirm main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuketangAutoPlayer
          path: dist/YuketangAutoPlayer.exe

      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YuketangAutoPlayer.exe
