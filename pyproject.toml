[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlforge"
version = "0.0.1"
description = "LLM-native open source SEO crawler and technical auditor with native MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mario Hernández", email = "developer@supera.dev" }]
keywords = ["seo", "crawler", "spider", "audit", "mcp", "duckdb", "technical-seo"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "scrapy>=2.11",
    "scrapy-playwright>=0.0.40",
    "playwright>=1.45",
    "advertools>=0.16",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "extruct>=0.17",
    "datasketch>=1.6",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "mcp>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
crawlforge = "crawlforge.cli.__main__:app"

[project.urls]
Homepage = "https://github.com/mario-hernandez/crawlforge"
Repository = "https://github.com/mario-hernandez/crawlforge"
Issues = "https://github.com/mario-hernandez/crawlforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
