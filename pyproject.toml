[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxyrotate"
version = "0.2.0"
description = "Run a command through a rotating pool of proxies via sing-box"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
authors = [
    { name = "Mrj-Srb", email = "srb.meraj@gmail.com" },
]
maintainers = [
    { name = "Mrj-Srb", email = "srb.meraj@gmail.com" },
]
keywords = ["proxy", "sing-box", "rotation", "proxyrotate", "socks5", "http-proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Mrj-Srb/ProxyRotate"
Repository = "https://github.com/Mrj-Srb/ProxyRotate"
Issues = "https://github.com/Mrj-Srb/ProxyRotate/issues"

[project.scripts]
proxyrotate = "proxyrotate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "twine>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proxyrotate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
