[project]
name = "tgphind"
version = "1.1.0"
description = "Search for articles by title in telegra.ph and its mirrors."
authors = [
    { name = "Nikita Denissov", email = "n.denissov@proton.me" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.scripts]
tgphind = "tgphind.__main__:main"

[tool.poetry.dependencies]
python = ">=3.9"

[project.urls]
Homepage = "https://github.com/ndenissov/tgphind"
Repository = "https://github.com/ndenissov/tgphind"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tgphind" }]
